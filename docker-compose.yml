services:
  tacticus-dumper:
    build: .
    container_name: tacticus-dumper
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      # If using Cloudflare Access for auth, leave these blank.
      # If NOT using Cloudflare Access, set a username/password here.
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}

      # Optional: pre-seed your Tacticus API key (skip the UI step)
      - TACTICUS_KEY=${TACTICUS_KEY:-}

      - DATA_DIR=/data
    volumes:
      - tacticus-data:/data

volumes:
  tacticus-data:
