services:
  tacticus-dumper:
    image: ghcr.io/jshauns81/tacticus-dumper:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tacticus-dumper
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5000"
    environment:
      TZ: ${TZ:-America/Chicago}
      DATA_DIR: /data
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      TACTICUS_KEY: ${TACTICUS_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    volumes:
      - tacticus-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  tacticus-data:
